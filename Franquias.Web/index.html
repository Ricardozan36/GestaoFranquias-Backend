<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Franquias S/A - Login</title>
    <!-- Conectando o arquivo de pintura -->
    <link rel="stylesheet" href="style.css">
    <!-- Trazendo uma fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h2>Acesso Restrito</h2>
            <p>Faça login para acessar o painel gerencial.</p>
            
            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" placeholder="admin@franquia.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="******">
            </div>

            <p id="mensagem-erro" class="erro-oculto">E-mail ou senha incorretos.</p>

            <button id="btn-login">Entrar no Sistema</button>
        </div>
    </div>

    <!-- Conectando o motor de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
